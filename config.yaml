# ============================================================
# Work Reporter — 自动日报/周报工具 配置文件
# ============================================================

# --- 截屏设置 ---
screenshot:
  # 全局快捷键 (格式: modifier+modifier+key)
  hotkey: "ctrl+shift+alt+s"     # 手动截屏快捷键
  pause_hotkey: "ctrl+shift+o"   # 暂停/恢复截屏的快捷键
  # auto_hotkey 已移除 — 自动截屏请通过仪表盘按钮或托盘右键菜单开启
  auto_interval_minutes: 10      # 自动截屏间隔（分钟）
  quality: 85                    # PNG 压缩质量 (0-100)
  duplicate_threshold: 5         # 感知哈希汉明距离阈值 (≤此值视为重复)
  storage_path: "data/screenshots" # 截图存储目录
  max_screenshots_per_day: 200   # 每日最大截图数（超出删旧）
  auto_start: true               # 启动时自动开启自动截屏（否则需手动点托盘/仪表盘）

# --- 隐私过滤 ---
privacy:
  # Layer 1: 应用黑名单 — 仅屏蔽真正敏感的隐私应用
  app_blacklist:
    # 个人即时通讯
    - "微信"
    - "WeChat"
    - "Telegram"
    - "Signal"
    - "WhatsApp"
    # 密码管理器
    - "1Password"
    - "Bitwarden"
    - "LastPass"
    - "KeePass"
    # 金融/支付
    - "银行"
    - "Bank"
    - "支付宝"
    - "Alipay"
    - "微信支付"
    - "招商银行"
    - "工商银行"
    - "建设银行"
    - "中国银行"

  # Layer 2: 区域模糊 — 屏幕区域坐标 (相对比例 0.0-1.0)
  blur_regions:
    # Windows 任务栏 (底部 ~40px, 典型 1080p)
    - name: "taskbar_bottom"
      y_start: 0.955
      y_end: 1.0
      x_start: 0.0
      x_end: 1.0
    # 浏览器地址栏区域 (顶部 ~60px)
    - name: "browser_address_bar"
      y_start: 0.0
      y_end: 0.045
      x_start: 0.0
      x_end: 1.0
    # Windows 标题栏 (顶部 ~30px)
    - name: "title_bar"
      y_start: 0.0
      y_end: 0.023
      x_start: 0.0
      x_end: 1.0

  # Layer 3: OCR 内容检测
  # ── Layer3：OCR 内容门禁 ──
  # 命中下列关键词/正则的截图**不发送云端 LLM**，按 on_hit 处理（默认整图删除）
  content_detection:
    enabled: true
    engine: "windows_ocr"       # windows_ocr（系统内置，需语言包）| tesseract（需装二进制）
    language: "zh-Hans-CN"      # Windows OCR 语言标签
    tesseract_language: "chi_sim+eng"   # 仅 engine=tesseract 时使用
    tesseract_path: ""          # 仅 engine=tesseract 时使用，留空自动查找
    max_image_dim: 4000         # OCR 前缩放上限（控制耗时）
    fail_closed: false          # OCR 不可用时是否也拦截（true=宁可全拦，false=记录告警后放行）
    on_hit: "delete"            # 命中后处置：delete=整图删除不留痕迹
    blur_radius: 25             # 备用：区域模糊半径（像素）

    # 敏感词：完整词表放本地未跟踪文件（默认 data/sensitive_keywords.txt，一行一词，# 开头为注释）
    # 仓库里只保留通用示例，避免把个人维护的过滤清单公开
    keyword_file: "data/sensitive_keywords.txt"
    sensitive_keywords:
      - "色情"
      - "成人视频"
      - "里番"
      - "无码"
      - "nsfw"
      - "r18"
      - "私钥"
      - "助记词"
      - "seed phrase"

    patterns:
      # 命中以下正则同样拦截（只保留强标识，避免误删）
      id_card: "\\d{17}[\\dXx]"
      bank_card: "\\d{16,19}"
      api_key: "(sk|pk|api|token|secret|key)-[a-zA-Z0-9_\\-]{20,}"
      # 备注：email / phone_cn / ip_address / password_dots 误伤率过高（登录框、内网 IP 到处都是），
      # 默认不参与门禁；需要时自行加回。

  # 窗口标题关键词过滤
  title_blacklist:
    - "private"
    - "incognito"
    - "隐私"
    - "无痕"
    - "密码"
    - "password"
    - "payment"
    - "支付"
    - "banking"
    - "网银"

# --- 调度设置 ---
scheduler:
  workday_start: "08:00"        # 工作日界：D 日的工作日 = [D 08:00, D+1 08:00)，凌晨归前一天
  work_hours_start: "09:00"     # 仅作记录，不参与任何逻辑（自动截屏全天运行）
  work_hours_end: "20:00"       # 同上
  work_days: [0, 1, 2, 3, 4]   # 工作日 (0=周一, 6=周日)
  daily_report_time: "18:00"    # 日报进度版（含到此刻）
  daily_report_finalize_time: "08:30"  # 次日补生成前一工作日的完整版（含凌晨，覆盖同名文件）
  weekly_report_day: 4          # 周报生成日 (0=周一 ... 4=周五)
  weekly_report_time: "18:30"   # 周报生成时间
  cleanup_time: "02:00"         # 旧截图清理时间
  cleanup_keep_days: 14         # 保留最近N天的截图
  skip_empty_reports: true      # 当天/本周零事件时跳过生成（不写空模板报告）

# --- 事件存储 ---
database:
  path: "data/work_reporter.db"

# --- 报告 ---
report:
  output_path: "reports"        # 报告输出目录
  format: "markdown"            # 报告格式: markdown | text | html

# --- Web 仪表盘 ---
web_dashboard:
  port: 8766                   # 本地 HTTP 服务端口（8765 已被 research_board_app 占用）
  auto_open: false             # 启动时自动打开浏览器（开机自启时不希望每次都弹窗）

# --- 视觉 LLM（截图分析） ---
# deepseek-flash 支持图像输入（OpenAI 兼容 image_url）；key 从环境变量 DEEPSEEK_API_KEY 读取，
# 不要在此文件写真实 key（config.yaml 已被 git 跟踪并推送到公开仓库）。
vision_llm:
  enabled: true                     # 是否启用视觉分析
  provider: "openai"                # ollama | openai | vllm | llama_cpp
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-flash"           # DeepSeek V4.1 Flash（支持 text+image）
  api_key: "${DEEPSEEK_API_KEY}"    # 由 config_loader 展开环境变量
  timeout: 180                      # 请求超时秒数（推理模型较慢）
  max_retries: 5                    # 本机到 api.deepseek.com 偶发连接重置，多给几次重试

# --- 文本 LLM（日报/周报生成） ---
text_llm:
  enabled: true                     # 是否启用 LLM 生成报告
  provider: "openai"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-flash"           # 共用同一个模型
  api_key: "${DEEPSEEK_API_KEY}"
  timeout: 180
  max_retries: 5
  gpu_fallback_model: ""            # 留空 = 不做 GPU 降级（原逻辑硬编码 ollama 模型名）
